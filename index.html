<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUGGED DECK - プロフェッショナル・ミュージックエンジン</title>
    <meta name="description" content="ブラウザ内のローカルデータベース(IndexedDB)を使用し、完全オフラインで音楽とプレイリストを管理・再生できるインダストリアルデザインのプレイヤー">
    <link rel="stylesheet" href="css/style.css?v=1.5">
</head>
<body>

    <!-- 非表示のHTML5オーディオ要素 -->
    <audio id="audio-player" style="position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; pointer-events: none;" playsinline></audio>

    <!-- アプリケーション・メインコンテナ (Spotify型レイアウト) -->
    <div class="app-container">

        <!-- 左側サイドバー領域 -->
        <aside class="sidebar-panel">

            <!-- アプリロゴ・ヘッダー -->
            <div class="panel-card" style="padding: 12px 16px;">
                <div class="app-brand">
                    RUGGED PLAYER <span class="app-brand-badge">PRO</span>
                </div>
            </div>

            <!-- ストレージ情報容量 (簡略版メーター) -->
            <div class="panel-card">
                <div class="panel-card-title">
                    <span>ストレージ使用量</span>
                </div>
                <div style="font-size: 0.75rem; color: var(--color-text-dim); display: flex; justify-content: space-between;">
                    <span>ローカル保存容量:</span>
                    <span id="storage-stats">0.0 MB / 1024 MB [0.0%]</span>
                </div>
                <div class="storage-capacity-bar">
                    <div class="storage-capacity-fill" id="storage-gauge"></div>
                </div>
            </div>

            <!-- システム設定 (バックグラウンド設定・YouTube映像設定) -->
            <div class="panel-card" style="display: flex; flex-direction: column; gap: 10px;">
                <div class="panel-card-title">
                    <span>システム設定</span>
                </div>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <!-- バックグラウンド再生トグル -->
                    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem;">
                        <span style="color: var(--color-text-dim);">バックグラウンド再生:</span>
                        <button id="btn-toggle-bg" class="btn-simple" style="padding: 4px 10px; font-size: 0.7rem; background: var(--color-amber-glow); color: #000; font-weight: bold; min-width: 70px; border: 1px solid var(--color-amber-glow);">ON</button>
                    </div>
                    <!-- YouTube映像表示トグル -->
                    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem;">
                        <span style="color: var(--color-text-dim);">YouTube映像表示:</span>
                        <button id="btn-toggle-yt-video" class="btn-simple" style="padding: 4px 10px; font-size: 0.7rem; background: var(--color-amber-glow); color: #000; font-weight: bold; min-width: 70px; border: 1px solid var(--color-amber-glow);">映像あり</button>
                    </div>
                </div>
            </div>

            <!-- 音源ファイルの取り込みドラッグエリア / YouTubeリンク追加 -->
            <div class="panel-card" style="display: flex; flex-direction: column; gap: 12px;">
                <div class="panel-card-title">楽曲の追加</div>
                
                <!-- ローカルファイルドラッグエリア -->
                <div class="drag-upload-zone" id="uploader-slot">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95C8.08 7.14 9.94 6 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.11c1.56.1 2.78 1.41 2.78 2.96 0 1.65-1.35 3-3 3zm-5.55-8h-2.9v3H8l4 4 4-4h-2.55z"/>
                    </svg>
                    <p style="font-weight: bold; margin-bottom: 2px;">ファイルをドロップ</p>
                    <span style="font-size: 0.65rem; color: var(--color-text-sub);">またはクリックして選択</span>
                    <input type="file" id="file-input" class="hidden-file-input" accept="audio/*" multiple>
                </div>

                <!-- YouTube URL 追加入力フォーム -->
                <div style="display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--color-border-clean); padding-top: 10px;">
                    <span style="font-size: 0.7rem; color: var(--color-text-dim); font-weight: bold;">YOUTUBEリンクを追加</span>
                    <div style="display: flex; gap: 6px;">
                        <input type="text" id="youtube-url-input" class="input-simple" placeholder="URLをペースト... (https://...)" style="font-size: 0.75rem;">
                        <button id="btn-add-youtube" class="btn-simple" style="padding: 6px 12px; font-size: 0.75rem;">追加</button>
                    </div>
                </div>
            </div>

            <!-- YouTubeミニモニター画面 (YouTube再生時に自動で現れ映像を流す窓) -->
            <div class="panel-card" id="youtube-monitor-panel" style="display: none; height: 160px; padding: 6px; overflow: hidden; background: #000;">
                <div class="panel-card-title" style="margin-bottom: 6px; font-size: 0.7rem;">YouTubeモニター</div>
                <div style="width: 100%; height: calc(100% - 18px); background: #000; border-radius: 4px; overflow: hidden; position: relative;">
                    <div id="youtube-player-iframe"></div>
                </div>
            </div>

            <!-- プレイリスト管理 -->
            <div class="panel-card library-container">
                <div class="panel-card-title">プレイリスト</div>
                <div class="playlist-creator-row">
                    <input type="text" id="new-playlist-input" class="input-simple" placeholder="新しいプレイリスト名を入力..." maxlength="30">
                    <button id="btn-create-playlist" class="btn-simple">作成</button>
                </div>
                <div class="playlists-scroll-area" id="playlists-list">
                    <!-- JSにより動的に構築されます -->
                </div>
            </div>

        </aside>

        <!-- 右側メイン表示領域 (プレイリストヘッダーと楽曲データベース) -->
        <main class="main-view-panel">

            <!-- プレイリストヘッダーバナー (ビジュアライザー内蔵) -->
            <section class="playlist-header-banner">
                <div style="display: flex; align-items: center; gap: 20px;">
                    <!-- プレイリスト代表画像 / イラスト表示領域 -->
                    <div class="playlist-header-cover" id="playlist-header-cover">
                        <!-- デフォルトの音楽CD/音符SVG -->
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.75z"/></svg>
                    </div>
                    
                    <div class="playlist-meta">
                        <div class="playlist-meta-type">ACTIVE PLAYLIST</div>
                        <div class="playlist-meta-title" id="playlist-context-title">すべての楽曲</div>
                    </div>
                </div>

                <!-- レトロ真空管風 琥珀色ビジュアライザー画面 -->
                <div class="vfd-visualizer-window" title="オーディオスペクトラムメーター">
                    <canvas id="visualizer-canvas" class="vfd-canvas"></canvas>
                </div>
            </section>

            <!-- 楽曲データベースリスト -->
            <section class="tracks-list-container">
                <table class="clean-table">
                    <thead>
                        <tr>
                            <th style="width: 50px; text-align: center;">#</th>
                            <th>曲名</th>
                            <th>アーティスト</th>
                            <th>サイズ</th>
                            <th>長さ / 操作</th>
                        </tr>
                    </thead>
                    <tbody id="track-table-body">
                        <!-- JSにより動的に楽曲の行が生成されます -->
                    </tbody>
                </table>
            </section>

        </main>

    </div>

    <!-- 下部固定 再生コントロールバー (Spotify型デッキ) -->
    <footer class="bottom-player-deck">

        <!-- 左側：再生中の曲情報とLED状態ランプ -->
        <div class="player-left-zone">
            <!-- ミニアルバムアート / イラスト表示領域 -->
            <div class="now-playing-cover" id="player-track-cover">
                <!-- デフォルトの音楽音符SVG -->
                <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            </div>
            
            <div class="now-playing-details">
                <div class="now-playing-title" id="vfd-track-title">楽曲が読み込まれていません</div>
                <div class="now-playing-artist" id="vfd-track-artist">音楽ファイルまたはYouTubeのURLを追加してください</div>
            </div>
            
            <div class="tactical-status-indicator">
                <span class="led-node" id="vfd-blink-dot"></span>
                <span id="vfd-status-text" style="font-weight: bold; margin-left: 6px;">システム起動中</span>
            </div>
        </div>

        <!-- 中央：再生・スキップボタンとタイムラインスライダー -->
        <div class="player-center-zone">
            <!-- コントロールボタン -->
            <div class="playback-controls-row">
                <button id="btn-shuffle" class="btn-control-key" title="シャッフル">
                    <svg viewBox="0 0 24 24">
                        <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
                    </svg>
                </button>
                <button id="btn-prev" class="btn-control-key" title="前の曲">
                    <svg viewBox="0 0 24 24">
                        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                    </svg>
                </button>
                <button id="btn-play" class="btn-control-key btn-play-pause-circle" title="再生">
                    <svg viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </button>
                <button id="btn-next" class="btn-control-key" title="次の曲">
                    <svg viewBox="0 0 24 24">
                        <path d="M6 18l8.5-6L6 6zm9-12h2v12h-2z"/>
                    </svg>
                </button>
                <button id="btn-loop" class="btn-control-key" title="リピート設定">
                    <svg viewBox="0 0 24 24">
                        <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
                    </svg>
                </button>
            </div>

            <!-- 再生シークバータイムライン -->
            <div class="progress-timeline-row">
                <span class="timeline-timer" id="time-current" style="color: var(--color-amber-glow);">00:00</span>
                <div class="timeline-slider-rail" id="progress-rail" title="シーク位置調整">
                    <div class="timeline-slider-fill" id="progress-fill"></div>
                </div>
                <span class="timeline-timer" id="time-total">00:00</span>
            </div>
        </div>

        <!-- 右側：音量スライダーとリピート表示パネル -->
        <div class="player-right-zone">
            <!-- 音量ゲイン -->
            <div class="gain-controller">
                <span class="gain-icon">VOLUME</span>
                <input type="range" id="volume-slider" class="slider-clean" min="0" max="1" step="0.05" value="0.8" title="音量調整">
            </div>

            <!-- リピート設定の文字ステータス -->
            <div class="system-loop-display" id="vfd-loop-text">リピート: OFF</div>
        </div>

    </footer>

    <!-- 曲情報編集モーダル overlay window -->
    <div id="editor-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-card-title">曲情報の編集</div>
            
            <!-- カバーアート（イラスト・画像）選択 -->
            <div class="modal-cover-section">
                <div class="modal-cover-preview" id="modal-cover-preview">
                    <!-- JavaScriptで画像またはデフォルト音符SVGを描画 -->
                </div>
                <button class="btn-simple" id="btn-select-cover" style="font-size: 0.75rem; padding: 6px 12px;">画像を設定する</button>
                <input type="file" id="cover-file-input" class="hidden-file-input" accept="image/*">
            </div>

            <!-- 曲名入力 -->
            <div class="modal-form-group">
                <label for="edit-title-input">曲名 (タイトル)</label>
                <input type="text" id="edit-title-input" class="input-simple" placeholder="タイトルを入力してください...">
            </div>

            <!-- アーティスト/作者入力 -->
            <div class="modal-form-group">
                <label for="edit-artist-input">作者 (アーティスト)</label>
                <input type="text" id="edit-artist-input" class="input-simple" placeholder="アーティスト・作成者名を入力してください...">
            </div>

            <!-- モーダル操作ボタン -->
            <div class="modal-actions-row">
                <button id="btn-cancel-edit" class="btn-simple" style="background: var(--color-bg-widget); color: var(--color-text-bright);">キャンセル</button>
                <button id="btn-save-edit" class="btn-simple" style="background: var(--color-amber-glow); color: #000;">保存する</button>
            </div>
        </div>
    </div>

    <!-- スクリプトのインポート (CORS問題の起きないfile://プロトコル対応順) -->
    <script src="js/db.js?v=1.5"></script>
    <script src="js/visualizer.js?v=1.5"></script>
    <script src="js/player.js?v=1.5"></script>
    <script src="js/playlist.js?v=1.5"></script>
    <script src="js/app.js?v=1.5"></script>
</body>
</html>
